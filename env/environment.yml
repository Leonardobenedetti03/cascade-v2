# Ambiente conda equivalente a env/requirements.txt.
#   conda env create -f env/environment.yml && conda activate dl4cv
# torch non è fissato: installarlo dopo, con la build CUDA del cluster (docs/RUNBOOK_HPC.md).
name: dl4cv
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      - -r requirements.txt
