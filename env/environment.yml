# Conda environment equivalent to env/requirements.txt.
#   conda env create -f env/environment.yml && conda activate dl4cv
# torch is not pinned: install it afterwards, with the CUDA build for your machine (docs/RUNBOOK_HPC.md).
name: dl4cv
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      - -r requirements.txt
