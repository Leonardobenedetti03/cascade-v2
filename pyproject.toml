[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade"
version = "0.2.0"
description = "DL4CV: a variable-cost cascade CamFormer -> TimeSformer-EgoVLP on Ego-Exo4D"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4", "hypothesis>=6", "ruff>=0.4", "black>=24", "pre-commit>=3"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["src"]
omit = ["src/cascade/models/vendor/*"]

[tool.black]
line-length = 120
target-version = ["py39"]
extend-exclude = 'third_party|src/cascade/models/vendor|scripts/01_extract_features\.py|src/cascade/data/takes\.py|src/cascade/data/poses\.py|src/cascade/data/video\.py|src/cascade/data/windows\.py|src/cascade/models/camformer\.py|src/cascade/models/egovlp\.py|src/cascade/training/heads\.py|src/cascade/utils/feature_config\.py|src/cascade/utils/feature_io\.py|tests/features'

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [
  "third_party",
  "src/cascade/models/vendor",
  "_synthetic_root",
  "scripts/01_extract_features.py",
  "src/cascade/data/takes.py",
  "src/cascade/data/poses.py",
  "src/cascade/data/video.py",
  "src/cascade/data/windows.py",
  "src/cascade/models/camformer.py",
  "src/cascade/models/egovlp.py",
  "src/cascade/training/heads.py",
  "src/cascade/utils/feature_config.py",
  "src/cascade/utils/feature_io.py",
  "tests/features",
]

[tool.ruff.lint]
# pyflakes, pycodestyle, sorted imports, bugbear, pyupgrade (stopped at 3.9: no "X | Y")
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E501",   # long lines: black handles them (strings and comments may go over)
  "B905",   # zip(strict=) does not exist in 3.9
  "B008",
  "UP006", "UP007", "UP035", "UP045",  # we keep typing.List/Optional: dataclasses are evaluated at runtime on 3.9
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]     # sys.path before the src imports
"tests/*.py" = ["E402", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
