# L0: CamFormer (third_party/seeing_without_pixels). Architettura dal paper / train.py.
camformer:
  arch:
    d_model: 128
    nhead: 4
    num_layers: 4
    dim_feedforward: 256
    dropout: 0.1
    output_dim: 512
    pose_encoding: rel9d_grav
  # Contesto in ingresso al transformer; il mean-pool si fa solo sulla finestra centrale.
  # null = uguale a data.window_s. TODO(HPC): quale contesto riproduce ~71%?
  context_s: null
  pretrained: true
  init_head_from_ckpt: false     # usa cls_model del checkpoint se presente (stesso ordine classi)
  eval_source: fold_ensemble     # val/test: media dei 5 modelli di fold | full
  mc_dropout_passes: 0           # >0 abilita le colonne MC dropout
  batch_size_eval: 256
  device: auto
  # Iperparametri di fine-tuning: non riportati nel paper, tutti da tarare.
  train:
    optimizer: adamw
    lr: 1.0e-4
    weight_decay: 1.0e-3
    head_lr_mult: 10.0
    epochs: 30
    batch_size: 64
    patience: 5
    monitor: val_loss            # val_loss | val_acc (sull'holdout interno)
    temporal_jitter_s: 0.0
    num_workers: 4
    pin_memory: true
    prefetch_factor: 2
    persistent_workers: false
    grad_clip: 1.0
