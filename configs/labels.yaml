# Canonical class order: index = position in the list.
# It is CamFormer's order (datasets/egoexo4d_pretrain.py::name2label and
# tasks/pretrain_longseq.py::class_names), so it matches a cls_model head in the checkpoint, if there is one.
# It is NOT the order of the `label` column of scenario_cls.csv: we always map the CSV by name (`csv_task`).
classes:
# Decision log (N28, 17/11): 6 classes, in the order of the scenario_preds heads. Music (0 takes) and Bouldering
# (2 takes) are left out: they do not have enough takes to be learned or evaluated.
  - {name: Basketball,  csv_task: Basketball,    kind: physical}
  - {name: Dance,       csv_task: Dance,         kind: physical}
  - {name: Soccer,      csv_task: Soccer,        kind: physical}
  - {name: Cooking,     csv_task: Cooking,       kind: procedural}
  - {name: Health,      csv_task: Health,        kind: procedural}
  - {name: Bike repair, csv_task: Bike Repair,   kind: procedural}
