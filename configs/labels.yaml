# Ordine canonico delle classi: indice = posizione nella lista.
# È l'ordine di CamFormer (datasets/egoexo4d_pretrain.py::name2label e
# tasks/pretrain_longseq.py::class_names), quindi coincide con un'eventuale testa
# cls_model nel checkpoint. NON è l'ordine della colonna `label` di
# scenario_cls.csv: la mappatura dal CSV avviene sempre per nome (`csv_task`).
classes:
# Registro (N28, 17/11): 6 classi, nell'ordine delle teste di scenario_preds. Music (0 take) e Bouldering
# (2 take) restano fuori: non hanno abbastanza take per essere imparate né valutate.
  - {name: Basketball,  csv_task: Basketball,    kind: physical}
  - {name: Dance,       csv_task: Dance,         kind: physical}
  - {name: Soccer,      csv_task: Soccer,        kind: physical}
  - {name: Cooking,     csv_task: Cooking,       kind: procedural}
  - {name: Health,      csv_task: Health,        kind: procedural}
  - {name: Bike repair, csv_task: Bike Repair,   kind: procedural}
