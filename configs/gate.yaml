# Gate v1 and its evaluation (first pipeline, now in the development history). The gate v2 of the report is
# configured in gate_v2.yaml. Features only from L0 and the trajectory.
# Families (blueprint 5.2): references, selective (thr_*), learned on y (logreg_*, lgbm_*) and
# compare_* (CompareConfidence, M06). There are no ridge_*, lgbmreg_* or bayes_* (note N16).
gate:
  reliability_alpha: 1.0         # Laplace smoothing of the per-class precision (feature B)
  emb_pca_dim: 16
  models: [always_L0, always_L1, random, oracle,
           thr_maxprob, thr_margin, thr_entropy,
           logreg_A, logreg_AC, logreg_ABC, lgbm_ABC,
           compare_A, compare_AC]
  # RQ2: at the same cost, does a gate that uses the trajectory predict when pixels are needed better than
  # CamFormer's confidence alone? Paired differences A − B (same resamples per take) on area, accuracy at
  # budget and share of the oracle.
  # The first two pairs are the RQ2 ones: compare_A against thr_maxprob isolates the effect of modelling the
  # expert; compare_AC against compare_A isolates the effect of the trajectory (only group C changes between
  # them). The third repeats the effect of the trajectory in the y family.
  comparisons:
    - [compare_A, thr_maxprob]
    - [compare_AC, compare_A]
    - [logreg_AC, logreg_A]
  reference: []                  # gate used for the cascade in the per-class tables (empty = best on val)
  logreg_Cs: [0.001, 0.01, 0.1, 1.0, 10.0]
  logreg_inner_cv: 3
  logreg_class_weight: balanced  # y = 1 is rare: balanced weights (ablation: configs/ablations/gate_weights.yaml, now archived)
  lgbm:
    num_leaves: 15
    min_child_samples: 20        # = min_data_in_leaf
    learning_rate: 0.05
    n_estimators: 500
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    early_stopping_rounds: 30
    valid_frac: 0.2
    deterministic: true          # identical results for the same seed (and number of threads)
    force_row_wise: true
  random_seeds: 10               # seeds averaged for the random gate
  seeds: [0, 1, 2]               # seeds for the stochastic gates (lgbm)
  r_step: 1                      # escalation share r in %, from 0 to 100
  budgets: [0.25, 0.5]           # fractions of the cost of always_L1
  within_pts: 0.01               # "within 1 point of always_L1"
  improvement_deltas: [0.0, 0.01]  # I(δ) = C_L1 / C(r*_δ): lowest cost to stay within δ of always_L1
  bacc_min_takes: 1              # balanced accuracy: a class leaves only with 0 takes in the split (N28)
  transfer_budgets: [0.25, 0.5]  # RQ1: threshold chosen on val for these budgets, applied to test
  operating_budget: 0.5          # operating point when operating_rule = budget
  # Operating point chosen on val (N28): within_pts = smallest escalation share with accuracy on val
  # >= accuracy of always_L1 on val − within_pts; budget = cost <= operating_budget × cost of always_L1.
  operating_rule: within_pts
  bootstrap: 1000
  bootstrap_seed: 0
  # N37: bootstrap unit and groups of the gates' inner CV (take | session). The default, take, is the same as
  # the scenario_v1 run (N33, N34), which stays reproducible this way. The per-session version was turned on
  # with --config configs/hpc/gate_v1_session.yaml (now archived); the gate v2 (stage 56) always works by session.
  bootstrap_unit: take
  inner_cv_groups: take
  # CompareConfidence (M06): P(c1 = 1 | z) with logistic regression, no class weights
  compare: {Cs: [0.001, 0.01, 0.1, 1.0, 10.0], inner_cv: 3}
