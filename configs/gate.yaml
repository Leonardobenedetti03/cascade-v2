# Gate e valutazione (sezione 6). Feature solo da L0 e dalla traiettoria.
# Famiglie (blueprint 5.2): riferimenti, selettivi (thr_*), appresi su y (logreg_*, lgbm_*) e
# compare_* (CompareConfidence, M06). Non ci sono ridge_*, lgbmreg_* e bayes_* (nota N16).
gate:
  reliability_alpha: 1.0         # smoothing di Laplace della precisione per classe (feature B)
  emb_pca_dim: 16
  models: [always_L0, always_L1, random, oracle,
           thr_maxprob, thr_margin, thr_entropy,
           logreg_A, logreg_AC, logreg_ABC, lgbm_ABC,
           compare_A, compare_AC]
  # RQ2: il gate che usa la traiettoria predice quando servono i pixel meglio della sola
  # confidenza di CamFormer, a parità di costo? Differenze A − B appaiate (stessi
  # ricampionamenti per take) su area, accuratezza a budget e quota dell'oracolo.
  # Le prime due coppie sono quelle di RQ2: compare_A contro thr_maxprob isola l'effetto di
  # modellare l'esperto; compare_AC contro compare_A isola l'effetto della traiettoria (tra i
  # due cambia solo il gruppo C). La terza ripete l'effetto della traiettoria nella famiglia y.
  comparisons:
    - [compare_A, thr_maxprob]
    - [compare_AC, compare_A]
    - [logreg_AC, logreg_A]
  reference: []                  # gate per la cascata nelle tabelle per classe (vuoto = migliore su val)
  logreg_Cs: [0.001, 0.01, 0.1, 1.0, 10.0]
  logreg_inner_cv: 3
  logreg_class_weight: balanced  # y = 1 è raro: pesi bilanciati (ablation: configs/ablations/gate_weights.yaml)
  lgbm:
    num_leaves: 15
    min_child_samples: 20        # = min_data_in_leaf
    learning_rate: 0.05
    n_estimators: 500
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    early_stopping_rounds: 30
    valid_frac: 0.2
    deterministic: true          # risultati identici a parità di seed (e di thread)
    force_row_wise: true
  random_seeds: 10               # seed mediati per il gate random
  seeds: [0, 1, 2]               # seed per i gate stocastici (lgbm)
  r_step: 1                      # quota di escalation r in %, da 0 a 100
  budgets: [0.25, 0.5]           # frazioni del costo di always_L1
  within_pts: 0.01               # "entro 1 punto da always_L1"
  improvement_deltas: [0.0, 0.01]  # I(δ) = C_L1 / C(r*_δ): costo minimo per stare entro δ da always_L1
  bacc_min_takes: 1              # accuratezza bilanciata: una classe esce solo con 0 take nello split (N28)
  transfer_budgets: [0.25, 0.5]  # RQ1: soglia scelta su val per questi budget, applicata al test
  operating_budget: 0.5          # punto di lavoro con operating_rule = budget
  # Punto di lavoro scelto su val (N28): within_pts = quota di escalation minima con accuratezza su val
  # >= accuratezza di always_L1 su val − within_pts; budget = costo <= operating_budget × costo di always_L1.
  operating_rule: within_pts
  bootstrap: 1000
  bootstrap_seed: 0
  # CompareConfidence (M06): P(c1 = 1 | z) con regressione logistica, senza pesi di classe
  compare: {Cs: [0.001, 0.01, 0.1, 1.0, 10.0], inner_cv: 3}
