# Configurazione di base. Percorsi come template:
#   {repo} = radice del repo, {data} = $CASCADE_DATA_ROOT o $DL4CV_ROOT/data,
#   {run} = run_dir ($CASCADE_RUN_ROOT o $DL4CV_ROOT/runs)/<run_name>.
# Nei pattern di take sono disponibili anche {takes_root} e {take_name}.

run_name: mvp_D8
seed: 0

paths:
  scenario_csv: "{repo}/third_party/seeing_without_pixels/data_files/egoexo4d/scenario_cls.csv"
  takes_json: "{data}/egoexo4d/takes.json"                       # TODO(HPC)
  takes_root: "{data}/egoexo4d/takes"                            # TODO(HPC)
  # Stream RGB degli occhiali Aria, versione 448 px. TODO(HPC): verificare il nome.
  video_pattern: "{takes_root}/{take_name}/frame_aligned_videos/downscaled/448/aria01_214-1.mp4"
  video_glob: "{takes_root}/{take_name}/frame_aligned_videos/downscaled/448/*214-1*.mp4"
  traj_pattern: "{takes_root}/{take_name}/trajectory/closed_loop_trajectory.csv"   # TODO(HPC)
  camformer_npz_dir: "{data}/camformer/egoexo4d_pretrain"        # solo traj_source=camformer_npz
  camformer_ckpt: "{data}/checkpoints/camformer/egoexo4d_dur8.pt"
  egovlp_ckpt: "{data}/checkpoints/egovlp/egovlp.pth"            # EgoVLP_PT_BEST
  # pesi torchvision IMAGENET1K_V1 di mobilenet_v3_small (baseline un frame). TODO(HPC)
  frame_baseline_ckpt: "{data}/checkpoints/torchvision/mobilenet_v3_small-047dcff4.pth"
  frames_dir: "{run}/10_frames"
  traj_cache_dir: "{run}/traj_cache"

data:
  window_s: 8.0              # durata D della clip; ablation 4 / 16
  n_windows: 1               # K finestre per take (gate per finestra, aggregazione per take); ablation K = 3, 5
  window_stride_s: null      # passo tra finestre se n_windows > 1 (default = window_s); solo con center
  window_placement: center   # center (attorno al centro della take) | uniform (K parti uguali della take)
  duration_source: takes_json   # takes_json | video | trajectory
  traj_source: aria_csv      # aria_csv (take intera, 1 kHz) | camformer_npz (segmenti rilasciati)
  traj_fps: 20.0             # frequenza attesa da CamFormer (1 kHz / 50)
  min_traj_coverage: 0.9     # frazione minima della finestra coperta dalla traiettoria
  vertical_axis: 2           # asse "su" del mondo Aria (gravità = -z). TODO(HPC)
  out_of_range: drop         # finestra oltre la fine del video: drop (scarta la clip) | clamp (ultimo frame)
  short_take: keep           # take più corta di window_s: keep (finestra = take intera) | drop
  max_missing_frac: 0.02     # clip perse tra uno stadio e l'altro oltre cui fermarsi (fail fast)
  expected_split_counts: {train: 3049, val: 836, test: 1109}   # solo sanity check

alignment:
  # same_origin: t=0 della traiettoria coincide con t=0 del video (+ offset_s).
  # device_us:   offset = (traj_start_us - video_start_us) / 1e6 dai metadati della take.
  mode: same_origin          # TODO(HPC): verificare con 15_alignment_check
  offset_s: 0.0
  scale: 1.0
  video_start_key: video_start_us
  traj_start_key: traj_start_us

frames:
  n_frames: 16
  # Come il transform di test di EgoVLP: Resize(256) lato corto, CenterCrop(256), Resize(224).
  pre_resize: 256
  crop: 256
  size: 224
  # Fedeltà a EgoVLP: i video erano ridotti a 256 px con ffmpeg (bicubico, antialias);
  # torchvision 0.13 (loro ambiente) non fa antialias nel Resize(224) su tensori.
  pre_resize_mode: bicubic
  pre_resize_antialias: true
  final_antialias: false
  rotate_k90: 0              # rotazioni di 90° antiorarie. TODO(HPC): i frame Aria sono dritti?
  decoder: auto              # auto | decord | pyav

folds:
  n_folds: 5
  inner_holdout_frac: 0.1
  seed: 0

# Baseline "un frame" L½ (B1): MobileNetV3-Small congelato su 1 frame a 112 px + testa
# lineare per fold (stadio 28), e cascata a tre livelli CamFormer → 1 frame → TimeSformer
# valutata nello stadio 50. Spenta di default.
frame_baseline:
  enabled: false
  arch: mobilenet_v3_small
  frame_index: 8             # dei 16 frame estratti (il centro della finestra)
  size: 112
  pretrained: true           # da paths.frame_baseline_ckpt, nessun download
  batch_size: 64
  device: auto
  w_grid_step: 0.1           # griglia delle fusioni con L½
  r_step: 5                  # griglia (r1, r2) della cascata a tre livelli

# Variante causale (fase E3): CamFormer sui prefissi f · D della finestra (stadio 22, stessi
# modelli dello stadio 20) e politica "fermati appena sei sicuro, altrimenti a fine finestra
# decidi se scalare" (stadio 57): costo medio, latenza di decisione, accuratezza. Spenta di default.
streaming:
  enabled: false
  prefixes: [0.25, 0.5, 0.75]   # frazioni della finestra; la finestra intera viene dalla cache (45)
  recalibrate: true             # temperatura per prefisso sull'holdout della fold (come lo stadio 20)
  tau_stop: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 0.99]   # soglie di stop anticipato su max p del prefisso
  gate: thr_maxprob             # score dell'escalation a fine finestra (o un gate dello stadio 50)
  r_step: 5
  within_pts: 1.0               # punto di lavoro: latenza minima entro 1 punto dalla cascata non causale

heads:
  source: probe              # probe (backbone congelato + logistica) | finetune (stadio 26)
  Cs: [0.001, 0.01, 0.1, 1.0, 10.0]
  inner_cv: 3
  max_iter: 2000

fusion:
  mode: fuse                 # fuse (log-lineare) | replace (solo L1) | learned (logistica appresa)
  w_grid_step: 0.05
  # fusione appresa (B5): logistica fuori campione; cam_emb possibile ma ogni fold ha il suo
  # spazio di embedding, quindi di default si usano le log-probabilità OOF di CamFormer
  learned_features: [cam_logprobs, vid_cls]
  compare_learned: true      # nel confronto di 35 anche quando mode != learned

cost:
  timesformer_frames: [4, 8, 16]
  latency_reps: 20
  gate_gmacs: 0.0
  # fvcore (con handle per l'attenzione SDPA, che fvcore da solo non conta), con accanto
  # torch.utils.flop_counter e la formula analitica come controllo: fvcore | torch | analytic.
  counter: fvcore
  device: auto
  expected: {camformer: 0.02, timesformer_4f: 90.0}   # sanity check, ordine di grandezza
