# Config of the feature pipeline (scripts/01_extract_features.py). ${VAR} is expanded from the environment
# (see hpc/features_env.sh). Command-line overrides: --set section.key=value (existing keys only).
# The run in the report used the values here plus --set window.n_windows=5 (see the README).

run_dir: ${SCENARIO_RUN_DIR}

data:
  # The two halves of the subset, each with split_manifest.csv, annotations/ and takes/.
  roots:
    - /home/3185472/egoexo4d_split_45G_physical
    - /home/3218863/Oasis_Deep_Vision_DSBA/egoexo4d_split_45G
  # Aria RGB stream at 448 px: the prefix varies (aria01, aria02, aria, aria1), 214-1 is always the RGB one.
  video_glob: "takes/{take_name}/frame_aligned_videos/downscaled/448/*214-1*.mp4"
  # Device trajectory (MPS, 1 kHz): the source CamFormer was pre-trained on.
  aria_csv_pattern: "${ARIA_TRAJ_ROOT}/{take_name}/trajectory/closed_loop_trajectory.csv"
  max_missing_frac: 0.02      # share of lost takes (video or poses) above which a stage stops
  expected_takes: 1273        # index stops if the count is different (null = no check)
  expected_gap_takes: 52      # only for the traj log: takes with missing frames in the JSON files (19 + 33 from the report)

labels:
  # Classes of the head, in this order. Music (0 takes) and Bouldering (2 takes) are left out of
  # training; the Bouldering takes still get a prediction, flagged as such.
  classes: [Basketball, Dance, Soccer, Cooking, Health, Bike repair]

split:
  mode: official              # official (split column of the manifests) | site (secondary analysis: val = fair + nus, test = georgiatech)
  # Cut of the official val into val and test, by session and stratified by class (only with mode: official).
  # mode: undecided (index runs, heads does not) | split (a share test_frac goes to test) | all_test (option C:
  # no val, the gate is calibrated on the out-of-sample train) | all_val. TO BE FIXED IN THE LOG BEFORE THE RUN.
  # Decision log (17/11 afternoon, replaces option C from the morning): option A, the official val (285 takes)
  # is cut once in half, by session and stratified by class: half val, half test.
  # Pose variant, windows and the gate's operating point are chosen on val.
  official_val:
    mode: split
    test_frac: 0.5
    seed: 0
  val_sites: [fair, nus]
  test_sites: [georgiatech]
  # Folds by site (mode: site): same map as cascade v2 (splits/site_v1/split.json).
  site_to_fold: {uniandes: 0, unc: 1, sfu: 2, cmu: 3, iiith: 3, minnesota: 3, indiana: 4, upenn: 4, utokyo: 4}
  n_folds: 5                  # mode: official -> StratifiedGroupKFold by session
  fold_seeds: [0, 1, 2]       # one fold partition per seed; probabilities are averaged over the seeds

window:
  length_s: 8.0               # window used for pooling (CamFormer) and for sampling the frames (EgoVLP)
  n_windows: 1                # windows per take, embeddings averaged over the take (the report uses 5, set with --set)
  placement: center           # center (around the centre) | uniform (K equal parts of the take)

poses:
  source: pose_json           # pose_json (RGB camera extrinsics, our planned choice) | aria_csv (device trajectory)
  fallback_to_json: false     # true: takes without a CSV -> pose_json (mixed sources, recorded in status.csv)
  fps: 20.0                   # rate CamFormer expects (1 kHz / 50)
  json_src_fps: 30.0          # pose_json: frame i = i / 30 s in video time
  json_max_gap_frames: 15     # pose_json: longer gaps (0.5 s) -> invalid samples
  # pose_json: R_world_device = json_world_rotation @ R_world_cam @ json_cam_to_device.
  # First plan: the OpenCV (x right, y down, z forward) -> Aria (x left, y up, z forward) conversion that the
  # paper applies to non-Aria poses (supp. 2.3). Check the roll with:  python scripts/01_extract_features.py check-up
  # (or with check-frame if real device poses are available).
  # Decision log (17/11, audit item 1): two pre-registered variants, chosen on val with the select stage
  # (CamFormer's balanced accuracy on val; on ties the identity wins):
  #   identity (the default, as in cascade-v2)  and  diag(-1,-1,1) = [[-1,0,0],[0,-1,0],[0,0,1]]
  #   (the OpenCV -> Aria conversion, which the official CamFormer code does NOT apply to non-Aria poses).
  # The identity was selected. check-up is only a diagnostic (it assumes the device y points up, not verified).
  json_cam_to_device: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
  json_world_rotation: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]

camformer:
  repo: ${CAMFORMER_REPO}     # clone of github.com/google-deepmind/seeing_without_pixels
  ckpt: ${CAMFORMER_CKPT}     # egoexo4d_dur8.pt from camformer_checkpoints.zip (DATA.md)
  pose_encoding: rel9d_grav
  d_model: 128
  nhead: 4
  num_layers: 4
  dim_feedforward: 256
  dropout: 0.1
  output_dim: 512
  context_s: 8.0              # input trajectory (>= window.length_s); dur8 = 8 s context
  min_coverage: 0.9           # minimum share of valid samples in the window
  # Decision log (17/11, audit item 3): takes without a CamFormer embedding (no window with coverage >= 0.9)
  # stay in the predictions with an empty cam_pred; the gate sends them to EgoVLP and they count as cost.
  # feat-camformer stops only if they are more than this share (data.max_missing_frac is for the other stages).
  max_missing_frac: 0.10
  batch_size: 128
  device: auto

egovlp:
  ckpt: ${EGOVLP_CKPT}        # EgoVLP_PT_BEST (github.com/showlab/EgoVLP)
  n_frames: 16                # evenly spaced time points in the window (as in cascade)
  frame_indices: [2, 6, 9, 13]  # the 4 frames given to the model
  pre_resize: 256
  crop: 256
  size: 224
  norm_mean: [0.485, 0.456, 0.406]
  norm_std: [0.229, 0.224, 0.225]
  img_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  num_frames: 4
  proj_dim: 256
  batch_size: 16
  num_workers: 4
  device: auto

heads:
  Cs: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  inner_cv: 3                 # inner CV (grouped by session) to choose C and the temperature
  max_iter: 3000
  class_weight: balanced      # null | balanced
  # Decision log (17/11, audit item 2): a class leaves the balanced accuracy only if it has 0 takes in the split.
  min_takes_metric: 1         # classes with fewer takes in the split leave the balanced accuracy
  n_boot: 2000                # session bootstrap of the balanced accuracy
  ci_level: 0.95

# Pre-registered check (heads): if it fails, heads exits with code 3 and the gate does not start.
check:
  model: camformer            # L0
  split: val                  # train (out of sample; required with official_val.mode: all_test) | val. Never test.
  # Pre-registered thresholds (decision log, 17/11 afternoon): on val, balanced accuracy >= 0.40 AND the lower end
  # of the 95% bootstrap interval (by session) above chance; on the out-of-sample train, recall > 0 for every class;
  # all 6 classes present both in val and in train (audit item 2).
  min_bacc: 0.40
  min_recall: null            # minimum recall of EVERY head class on the OOF train (null = just recall > 0)
  ci_above_chance: true       # also require the lower end of the bootstrap above chance
  require_all_classes: true   # fail if a head class has 0 takes in the split of the check or in train
