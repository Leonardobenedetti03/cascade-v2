name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.4" "black>=24"
      - run: ruff check src scripts tests
      - run: black --check src scripts tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # setup-python non ha la 3.9 per ubuntu-latest (26.04): Python da uv (build
      # python-build-standalone), in un venv con pip; stessa strada per la 3.11.
      - uses: astral-sh/setup-uv@v6
      - name: python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --seed --python ${{ matrix.python-version }} "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
      - name: torch CPU
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: dipendenze
        run: |
          python --version
          grep -v -E "^(torch|torchvision|transformers|decord|fvcore)" env/requirements.txt > /tmp/req.txt
          python -m pip install -r /tmp/req.txt pytest-cov hypothesis
          python -m pip install --no-build-isolation fvcore
      - name: pytest (include la pipeline sintetica breve end-to-end)
        run: python -m pytest -q --cov=src --cov-report=term-missing:skip-covered
