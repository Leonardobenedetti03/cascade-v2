# Opzionale: pre-commit install (non tocca submodule né src/cascade/models/vendor)
repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        exclude: ^(third_party/|src/cascade/models/vendor/)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        exclude: ^(third_party/|src/cascade/models/vendor/)
